function wtime(s,key){
 if(typeof key==='number') return s.t0+key;
 for(const w of s.words){ if(w.w.toLowerCase().includes(key)) return w.t; }
 return s.t0+0.2;
}

function setup(data){
 D=data; const root=$('#scenes'); $('#wm').textContent=D.wm||'';
 D.scenes.forEach((s,i)=>{
  const div=document.createElement('div'); div.className='scene'; div.style.display='none';
  const lab=`<div class="lab">// ${s.label}</div>`;
  const nch=s.words.map(w=>w.w).join(' ').length;
  const hl=`<div class="hl${nch>105?' sm':''}">`+s.words.map((w,j)=>`<span data-j="${j}">${w.e?`<b class="e">${w.w}</b>`:w.w}${w.p||''}${j<s.words.length-1?' ':''}</span>`).join('')+'</div>';
  const [html,els]=card(s.card,s.x||{});
  div.innerHTML=lab+hl+'<div class="cards" style="position:absolute;inset:0">'+html+'</div>'; root.appendChild(div);
  div.style.display='';const hb=div.querySelector('.hl').getBoundingClientRect().bottom;div.style.display='none';
  const sh=Math.max(-60,Math.min(26,hb+16-196));div.querySelector('.cards').style.transform=`translateY(${sh}px)`;
  s.div=div; s.spans=[...div.querySelectorAll('.hl span')];
  s.els=els.map(([sel,key,rot,kind])=>({el:div.querySelector(sel),t:wtime(s,key),rot:rot||0,kind:kind||'pop'}));
  s.pops=[...div.querySelectorAll('#p_hl .el')];
 });
 window.READY=true;
}

function env(t){const i=Math.floor(t*D.fps);return D.env[Math.max(0,Math.min(D.env.length-1,i))]||0}

function drawAta(t,pose,sceneT){
 const a=env(t), a2=env(t-0.05); const m=Math.max(a,a2*0.8);
 const open=2+24*m;
 $('#mouth').setAttribute('d',`M175 552 Q190 ${552+open} 205 552 Q190 ${552+Math.min(4,open*0.2)} 175 552Z`);
 $('#tongue').setAttribute('d',open>12?`M183 ${552+open*0.55} Q190 ${552+open*0.92} 197 ${552+open*0.55}Z`:'');
 const blink=((t+0.7)%3.6)<0.13;
 $('#eyes').style.display=blink?'none':''; $('#lidL').style.display=blink?'':'none'; $('#lidR').style.display=blink?'':'none';
 const lx=Math.sin(t*0.7)*1.2, ly=-1.8;

 $('#brows').setAttribute('transform',`translate(0 ${wow?-7:-a*4-Math.max(0,Math.sin(t*1.3))*1.5})`);

 $('#head').setAttribute('transform',`translate(0 ${dy}) rotate(${rot} 190 600)`);

 show('#pThumb',pose==='thumb'); show('#pOpen',pose==='wave'||pose==='talk'||pose==='wow'); show('#pPoint',pose==='point'||pose==='down');
 show('#armL',wow);

 if(pose==='wave'){hr=Math.sin(t*9)*16; hy=566;}
 else if(pose==='talk'){hy=600-14*k-a*10; hx=298; hr=Math.sin(t*3)*6;}
 else if(pose==='point'){hy=560+(1-k)*30+Math.sin(t*5)*2; hr=-6;}
 else if(pose==='thumb'){hy=574+(1-k)*30; hr=Math.sin(t*6)*4;}
 else if(pose==='wow'){hy=560+(1-k)*30; hr=Math.sin(t*7)*8; $('#handL').setAttribute('transform',`translate(76 ${560+(1-k)*30}) rotate(${-Math.sin(t*7)*8})`);}
 else if(pose==='down'){hy=604+Math.sin(t*8)*4; hx=302; hr=180;}

function draw(t){
 let cur=0; D.scenes.forEach((s,i)=>{ if(t>=s.t0) cur=i; });
 const sh=t<0.3?Math.sin(t*90)*(0.3-t)*10:0;
 $('#stage').style.transform=`translate(${sh}px,${sh*0.4}px)`;
 $('#prog').style.width=(100*clamp(t/D.dur))+'%';
 D.scenes.forEach((s,i)=>{
  if(i!==cur){s.div.style.display='none';return}
  s.div.style.display='';
  const end=s.t1, xo=clamp((t-(end-0.16))/0.16);
  s.div.style.opacity=1-xo; s.div.style.transform=`scale(${1-0.04*xo})`;
  const hook=i===0;
  s.spans.forEach((sp,j)=>{
   const w=s.words[j]; const p=clamp((t-w.t)/(hook?0.28:0.16));
   if(t<w.t){ sp.style.opacity=hook?0:0.2; sp.style.transform=hook?'scale(.4)':'none'; }
   else if(hook){ sp.style.opacity=clamp(p*3); sp.style.transform=`scale(${0.4+0.6*eob(p)}) translateY(${(1-eo(p))*8}px)`; }
   else { sp.style.opacity=0.2+0.8*eo(p); sp.style.transform=`translateY(${(1-eo(p))*-3}px)`; }
  });
  s.els.forEach(o=>{
   if(!o.el) return;
   const p=clamp((t-o.t)/0.38);
   if(o.kind==='strike'){o.el.style.opacity=t<o.t?0:1;o.el.style.transform=`scaleX(${eo(clamp((t-o.t)/0.3))})`;return}
   if(o.kind==='grow'){const g=clamp((t-o.t)/2.2);o.el.style.opacity=1;o.el.style.transform=`scaleX(${0.08+0.92*eo(g)})`;return}
   if(t<o.t){o.el.style.opacity=0;o.el.style.transform=`scale(.5) rotate(${o.rot}deg)`;return}
   let sc=0.5+0.5*eob(p), extra='';
   if(o.kind==='row'){o.el.style.opacity=eo(p);o.el.style.transform=`translateX(${(1-eo(p))*-24}px)`;return}
   if(o.kind==='fade'){o.el.style.opacity=eo(p);o.el.style.transform='none';
     s.div.querySelectorAll('#l_p').forEach(q=>q.style.strokeDashoffset=-t*30);return}
   if(o.kind==='swipe'){const c=((t-o.t)%0.9)/0.9;o.el.style.opacity=Math.sin(Math.PI*c);o.el.style.transform=`translateY(${-c*50}px)`;return}
   if(o.kind==='q') extra=` rotate(${Math.sin(t*6)*8}deg)`;
   if(o.kind==='btn'){ sc*=1+0.05*Math.sin(t*7); }
   if(o.kind==='tap'){ const c=((t-o.t)%1.0); const press=c<0.15?c/0.15:c<0.3?1-(c-0.15)/0.15:0;
     o.el.style.opacity=eo(p); o.el.style.transform=`translate(${-press*6}px,${-press*10+(1-eo(p))*40}px) scale(${1-press*0.08})`; return}
   o.el.style.opacity=clamp(p*3); o.el.style.transform=`scale(${sc}) rotate(${o.rot}deg)${extra}`;
  });
  if(s.pops.length){ const th=wtime(s,'highlights');
   s.pops.forEach((e,j)=>{const p=clamp((t-th-j*0.12)/0.3); e.style.opacity=t<th?0.25:0.25+0.75*eo(p); e.style.transform=`scale(${t<th?1:0.6+0.4*eob(p)})`;}); }
 });
 drawAta(t,D.scenes[cur].pose,t-D.scenes[cur].t0);
