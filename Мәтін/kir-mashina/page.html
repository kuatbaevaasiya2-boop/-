<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-x,3), eob=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
let D;
function key(ks,t){ if(t<=ks[0][0])return ks[0][1]; for(let i=1;i<ks.length;i++){ if(t<ks[i][0]){const k=(t-ks[i-1][0])/(ks[i][0]-ks[i-1][0]);const s=k*k*(3-2*k);return lerp(ks[i-1][1],ks[i][1],s);} } return ks[ks.length-1][1]; }
function hash(i){const x=Math.sin(i*127.1+11.7)*43758.5;return x-Math.floor(x)}
function mouthAt(t){ for(const m of D.mouth){ const i=Math.floor((t-m.t)*30); if(i>=0&&i<m.e.length) return m.e[i]; } return 0; }
window.setup=d=>{D=d; const P=$('#pops'); d.pops.forEach((p,i)=>{const e=document.createElement('div');e.className='pop';e.textContent=p.w;e.id='p'+i;P.appendChild(e);});};
window.draw=t=>{
 const F=D.FREEZE, sh=t<F? clamp((t-0.35)/0.8)*(t>D.V1-0.2?0.5:1):0;
 // машина орны
 const mx=key([[0,180],[0.6,180],[2.0,150],[3.3,205],[4.5,178],[5.6,236],[6.8,250]],t);
 // соққы секірісі
 let hop=0, tilt=0, squash=0, last=-9, li=0;
 D.thumps.forEach((x,i)=>{ if(x<=t+0.13 && x>last && t<F+0.2){ last=x; li=i; } });
 const big=t<D.V1-0.2 ? 1 : 0.45;
 if(last>-9){ const dt=t-last; const s=(hash(li)>.5?1:-1);
   if(dt<0){ const k=1+dt/0.13; hop=-Math.sin(Math.PI*k*0.5)*14*big*(0.6+0.4*hash(li+3)); tilt=s*5*big*k; }
   else if(dt<0.18){ squash=Math.exp(-dt*25)*0.06*big; tilt=s*5*big*Math.exp(-dt*30); } }
 const jit= sh*(Math.sin(t*61)*1.6+Math.sin(t*97+1)*1.1);
 const jr = sh*(Math.sin(t*53+2)*1.4);
 $('#mach').setAttribute('transform',`translate(${mx+jit} 560)`);
 $('#mbody').setAttribute('transform',`translate(0 ${hop}) rotate(${tilt+jr} 0 -90) scale(${1+squash} ${1-squash})`);
 $('#mshadow').setAttribute('rx',78-Math.abs(hop)*1.2);
 $('#mlines').style.opacity= t<F ? clamp(sh*1.3)*(0.6+0.4*Math.sin(t*40)) : 0;
 $('#knob').setAttribute('transform',`translate(58 -166) rotate(${t<F? t*90 : F*90})`);
 // барабан
 const ang = t<F ? t*420 : F*420 + 420*0.25*(1-Math.exp(-(t-F)*4));
 $('#clothes').setAttribute('transform',`rotate(${ang})`);
 const wl = 10 + 6*Math.sin(t*9)*sh; let w='M-50 60 L-50 '+(wl)+' ';
 for(let x=-50;x<=50;x+=5) w+=`L${x} ${wl+ (sh*5+0.6)*Math.sin(x*0.15+t*14)} `; w+='L50 60Z'; $('#water').setAttribute('d',w);
 let b=''; for(let i=0;i<6;i++){ const ph=(t*1.2+i/6)%1; const bx=-30+hash(i)*60+Math.sin(t*3+i)*5, by=40-ph*80; const r=2+hash(i+9)*2.5; if(sh>0) b+=`M${bx-r} ${by} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0`; } $('#bubbles').setAttribute('d',b);
 // машинаның беті
 const scold = t>D.V2+0.2;   // «магазин» естігенде шошиды
 const guilty = t>F+0.15;
 let bl='M-24 -12 L-6 -7', br='M24 -12 L6 -7', pupx=1, pupy=1, eyS=1;
 if(scold&&!guilty){ bl='M-24 -15 L-6 -16'; br='M24 -15 L6 -16'; eyS=1.15; pupx=-2; pupy=0; }
 if(guilty){ bl='M-24 -10 L-6 -15'; br='M24 -10 L6 -15'; pupx=-3; pupy=3; eyS=0.95; }
 if(!scold && t>D.WALK0+0.5){ pupx=-3; }
 $('#mbrowL').setAttribute('d',bl); $('#mbrowR').setAttribute('d',br);
 document.querySelectorAll('.mp').forEach(p=>{p.setAttribute('cx',pupx+(t<F?Math.sin(t*30)*0.8:0));p.setAttribute('cy',pupy);});
 $('#meyeL').setAttribute('transform',`translate(-14 0) scale(${eyS})`); $('#meyeR').setAttribute('transform',`translate(14 0) scale(${eyS})`);
 $('#sweat').setAttribute('opacity',guilty?1:0); $('#sweat').setAttribute('transform',`translate(0 ${guilty? clamp((t-F-0.15)/1.2)*10:0})`);
 // сөре дірілі
 const sv=sh*Math.max(0,1-(t-last)*5)*(last>-9?1:0);
 ['#b1','#b2','#b3'].forEach((s,i)=>$(s).setAttribute('transform',`rotate(${sv*6*Math.sin(t*50+i*2)} ${265+i*28} 200)`));
 // камера дірілі
 const cs = t<D.V1-0.2 && last>-9 ? Math.max(0,1-(t-last)*8)*2.2 : 0;
 $('#stage').style.transform=`translate(${cs*Math.sin(t*90)}px ${cs*Math.cos(t*77)}px)`;
 // есік
 const dk=eo(clamp((t-D.DOOR)/0.45));
 $('#door').setAttribute('transform',`translate(16 0) scale(${1-dk*0.82} 1) translate(-16 0)`);
 // келін
 const wk=clamp((t-D.WALK0)/(D.WALK1-D.WALK0)); const kx=lerp(-80,92,eo(wk));
 const walking=wk>0&&wk<1; const step=walking?Math.sin(wk*Math.PI*6):0;
 $('#kel').setAttribute('transform',`translate(${kx} 568) scale(1.06)`);
 $('#kel').style.display= t<D.WALK0 ? 'none':'';
 $('#kbody').setAttribute('transform',`translate(0 ${-Math.abs(step)*5}) rotate(${step*2} 0 0)`);
 $('#shoeL').setAttribute('cx',-18+step*6); $('#shoeR').setAttribute('cx',18-step*6);
 // оң қол: белде -> машинаны көрсетеді
 const pk=eo(clamp((t-(D.V2-0.15))/0.3))*(1-eo(clamp((t-(F+0.9))/0.4)));
 const sx=36, sy=-186, ex=lerp(70,62,pk), ey=lerp(-140,-196,pk), hx=lerp(44,104,pk), hy=lerp(-108,-214,pk);
 const ap=`M${sx} ${sy} L${ex} ${ey} L${hx} ${hy}`; $('#armRp').setAttribute('d',ap); $('#armRf').setAttribute('d',ap);
 $('#handR').setAttribute('transform',`translate(${hx} ${hy})`);
 $('#finger').style.opacity=$('#finger2').style.opacity=pk>0.5?1:0;
 // бет: ауыз, қабақ, көз
 const me=mouthAt(t); const mo=me*9;
 $('#kmouth').setAttribute('d', mo>0.8 ? `M-9 25 Q0 ${23+mo*0.4} 9 25 Q0 ${27+mo*1.4} -9 25Z` : `M-8 26 Q0 24 8 26 Q0 27.5 -8 26Z`);
 const stern = t>D.WALK1-0.2;
 $('#kbrowL').setAttribute('d',stern?'M-22 -12 L-5 -5':'M-22 -10 L-6 -9'); $('#kbrowR').setAttribute('d',stern?'M22 -12 L5 -5':'M22 -10 L6 -9');
 const blink = [6.2,10.4,12.6].some(b=>t>b&&t<b+0.12);
 const half = stern && !blink ? 3 : (blink?9:0);   // сәл қысылған көз
 $('#klids').setAttribute('d', half? `M-21 ${-6} Q-13 ${-10} -5 -6 L-5 ${-6+half} Q-13 ${-8+half} -21 ${-6+half}Z M21 -6 Q13 -10 5 -6 L5 ${-6+half} Q13 ${-8+half} 21 ${-6+half}Z`:'');
 const look = t>D.WALK1-0.3 ? 2.5 : 1.5;
 document.querySelectorAll('.kp').forEach(p=>p.setAttribute('cx',look));
 const nod = (t>F+0.3 && t<F+0.9) ? Math.sin((t-F-0.3)/0.6*Math.PI)*4 : 0;
 $('#khead').setAttribute('transform',`translate(0 ${-246+nod*0.6}) rotate(${me*2*Math.sin(t*9)+nod})`);
 // комикс сөздер
 D.pops.forEach((p,i)=>{ const e=$('#p'+i); const dt=t-p.t; if(dt<0||dt>0.5){e.style.opacity=0;return;}
   const k=eob(clamp(dt/0.16)); e.style.opacity= dt>0.38? 1-(dt-0.38)/0.12 : 1;
   const x= p.side? mx+70 : mx-150, y=300+(i%3)*22 - dt*20, r=(p.side?10:-10)+hash(i)*6-3;
   e.style.left=Math.max(6,Math.min(250,x))+'px'; e.style.top=y+'px'; e.style.transform=`rotate(${r}deg) scale(${0.4+0.6*k})`; });
 // сөйлеу көпіршігі
 const s1=t>=D.V1-0.15, s2=t>=D.V2-0.15;
 const bub=$('#bub'); const tg = s2? 'Мінезіңді <b>магазинде</b> көрсетесің.' : 'Жұлқынбай жу.';
 if(bub.dataset.t!==tg){bub.innerHTML=tg;bub.dataset.t=tg;}
 const st = s2? D.V2-0.15 : D.V1-0.15; const bk=eob(clamp((t-st)/0.22));
 const vis = s1 && t<D.dur-0.05;
 bub.style.opacity= vis?1:0; $('#who').style.opacity=vis?1:0;
 bub.style.transform=`scale(${vis?0.6+0.4*bk:1})`;
